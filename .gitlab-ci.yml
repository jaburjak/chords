stages:
  - test
  - package

test:
  stage: test
  image: stayallive/php:8.5
  before_script:
    - docker-php-ext-enable gd
  script:
    - cd implementation
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress
    - ./vendor/bin/phpunit

package:
  stage: package
  image: stayallive/php:8.5
  before_script:
    - apt-get update -qq
    - apt-get install -qq --no-install-recommends zip
  script:
    - cd implementation
    - zip -q -r ../package.zip .
  after_script:
    - mv package.zip "chords-$CI_COMMIT_REF_SLUG.zip"
  when: always
  artifacts:
    paths:
      - chords-$CI_COMMIT_REF_SLUG.zip
    expire_in: 1 month
